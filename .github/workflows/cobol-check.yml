# .github/workflows/cobol-check.yml
# Pipeline COBOL : compilation de tous les programmes + tests unitaires cobol-check
#
# Organisation du dépôt :
#   */*.cob                          <- vos programmes, dans leurs dossiers
#   tests/<programme>/*.cut          <- tests cobol-check (même nom que le source)
#   compile.sh                       <- script de compilation (utilisable en local)
#   .cobolignore                     <- optionnel : programmes à ne pas compiler

name: COBOL - Compilation et tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # 1. Tous les programmes doivent compiler
  # ---------------------------------------------------------------
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
          cobc --version | head -1

      - name: Compiler tous les programmes
        run: bash compile.sh

  # ---------------------------------------------------------------
  # 2. Tests unitaires des programmes qui ont un dossier dans tests/
  # ---------------------------------------------------------------
  tests-unitaires:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer GnuCOBOL et Java
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol openjdk-17-jre-headless unzip
          cobc --version | head -1
          java -version

      - name: Installer cobol-check
        run: |
          git clone --depth 1 https://github.com/openmainframeproject/cobol-check.git /tmp/cc-src
          unzip -q /tmp/cc-src/build/distributions/cobol-check-*.zip -d "$HOME/cobolcheck"
          cd "$HOME/cobolcheck"
          sed -i 's/\r$//' scripts/linux_gnucobol_run_tests
          chmod +x scripts/linux_gnucobol_run_tests

      - name: Lancer les tests
        run: |
          CC="$HOME/cobolcheck"
          JAR=$(ls "$CC"/bin/cobol-check-*.jar | head -1)
          mkdir -p resultats
          status=0

          for testdir in tests/*/; do
            prog=$(basename "$testdir")

            src=$(find . -path ./tests -prune -o -type f \
                  \( -name "$prog.cob" -o -name "$prog.cbl" \
                     -o -name "$prog.COB" -o -name "$prog.CBL" \) -print | head -1)
            if [ -z "$src" ]; then
              echo "::error::Source introuvable pour le programme $prog"
              status=1
              continue
            fi
            if ! ls "$testdir"*.cut >/dev/null 2>&1; then
              echo "::error::Aucun fichier .cut dans $testdir"
              status=1
              continue
            fi

            echo "::group::Tests de $prog ($src)"
            mkdir -p "$CC/src/test/cobol/$prog"
            rm -f "$CC/src/test/cobol/$prog/"*.cut
            cp "$src" "$CC/src/main/cobol/"
            cp "$testdir"*.cut "$CC/src/test/cobol/$prog/"

            (cd "$CC" && java -jar "$JAR" -p "$prog")

            cp "$CC/testruns/testResults.txt" "resultats/$prog.txt"
            cat "resultats/$prog.txt"
            echo "::endgroup::"

            # cobol-check renvoie toujours 0 : on lit le résultat nous-mêmes
            if ! grep -qE '^[[:space:]]*0 FAILED' "resultats/$prog.txt"; then
              echo "::error::Des tests ont échoué (ou n'ont pas tourné) pour $prog"
              status=1
            fi

            echo "### Tests : $prog" >> "$GITHUB_STEP_SUMMARY"
            grep -E 'EXECUTED|PASSED|FAILED' "resultats/$prog.txt" \
              | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          done

          exit $status

      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-cobol-check
          path: resultats/